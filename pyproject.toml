[project]
name = "linguaforge"
version = "0.1.0"
description = "Assistente local de aprendizado de ingles com IA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
linguaforge = "linguaforge.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
