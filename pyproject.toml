[project]
name = "linguaforge"
version = "0.1.0"
description = "Assistente local de aprendizado de ingles com IA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[project.scripts]
linguaforge = "linguaforge.main:main"
linguaforge-web = "linguaforge.web:run"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
